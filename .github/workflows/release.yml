name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Package zip for manual install
        run: |
          mkdir -p dist/obsidian-optical-zoom
          cp main.js manifest.json styles.css dist/obsidian-optical-zoom/
          cd dist && zip -r ../obsidian-optical-zoom.zip obsidian-optical-zoom
      - name: Create release with plugin assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            main.js manifest.json styles.css obsidian-optical-zoom.zip \
          || gh release upload "$tag" main.js manifest.json styles.css obsidian-optical-zoom.zip --clobber
